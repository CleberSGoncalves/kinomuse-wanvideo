name: Build & Push Docker Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clebersgoncalves/kinomuse-wanvideo:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build da imagem
        run: |
          docker build \
            --build-arg CACHE_BUST=2026-05-27 \
            --build-arg HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            -t ${{ env.IMAGE }} \
            .

      - name: Push da imagem
        run: docker push ${{ env.IMAGE }}

      - name: Imagem publicada!
        run: |
          echo "=================================="
          echo "Imagem disponivel em:"
          echo "${{ env.IMAGE }}"
          echo "Atualize o endpoint no RunPod:"
          echo "https://www.runpod.io/console/serverless/5qf5a2h1ojhgcz"
          echo "=================================="
