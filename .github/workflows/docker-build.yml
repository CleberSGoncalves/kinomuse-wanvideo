name: Build & Push Docker Image (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/clebersgoncalves/kinomuse-wanvideo:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Limpeza ultra agressiva de disco no runner (libera ~25GB a mais antes de particionar)
        run: |
          echo "=== Espaco antes da limpeza ==="
          df -h
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/rust
          sudo rm -rf /usr/local/lib/node_modules
          echo "=== Espaco depois da limpeza ==="
          df -h

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1
          temp-reserve-mb: 100
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/var/lib/docker'

      - name: Restart docker
        run: sudo service docker restart

      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build da imagem (com log detalhado)
        run: |
          set -eo pipefail
          echo "Iniciando build..."
          docker build \
            --progress=plain \
            --build-arg CACHE_BUST=2026-05-27 \
            --build-arg HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            -t ${{ env.IMAGE }} \
            . 2>&1 | tee /tmp/build.log
          echo "Build concluido!"

      - name: Mostrar log de erro se falhar
        if: failure()
        run: |
          echo "=== ULTIMAS 100 LINHAS DO LOG ==="
          tail -100 /tmp/build.log || echo "Log nao disponivel"

      - name: Push da imagem
        run: docker push ${{ env.IMAGE }}

      - name: Imagem publicada!
        run: |
          echo "=================================="
          echo "Imagem: ${{ env.IMAGE }}"
          echo "=================================="
