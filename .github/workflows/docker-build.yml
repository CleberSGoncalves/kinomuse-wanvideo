name: Build & Push Docker Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

env:
  IMAGE_NAME: kinomuse-wanvideo
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            CACHE_BUST=2026-05-27
            HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Imagem publicada!
        run: |
          echo "=================================="
          echo "Imagem disponivel em:"
          echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          echo "=================================="
